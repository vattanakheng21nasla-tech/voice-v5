<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ឯកសារថតសម្លេង & កំណត់ហេតុ | Voice-V5 Pro Share</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Moul&family=Siemreap&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Kantumruy Pro', sans-serif; }
    .font-muol { font-family: 'Moul', 'Khmer OS Muol Light', serif; }
    .a4-paper {
      background: white;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      padding: 2.5cm 2cm 2.5cm 2.5cm;
      color: #111827;
      line-height: 1.8;
      font-size: 14px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="bg-slate-950/80 backdrop-blur border-b border-slate-800 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center">
          <i data-lucide="radio" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-white">Voice-V5 Pro <span class="text-xs text-emerald-400 font-mono">Shared</span></h1>
          <p class="text-[11px] text-slate-400">ឯកសារចែករំលែកសម្លេង & កំណត់ហេតុរដ្ឋបាល</p>
        </div>
      </div>
      <a href="/" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
        <i data-lucide="home" class="w-3.5 h-3.5"></i>
        <span>ទំព័រដើម</span>
      </a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 space-y-6">
    
    <!-- Loading State -->
    <div id="loadingBox" class="text-center py-20 text-slate-400">
      <i data-lucide="loader" class="w-8 h-8 animate-spin mx-auto mb-3 text-emerald-500"></i>
      <p class="text-sm">កំពុងផ្ទុកឯកសារ...</p>
    </div>

    <!-- Content State -->
    <div id="contentBox" class="hidden space-y-6">
      
      <!-- Audio Player Card -->
      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-800">
          <div>
            <div class="inline-flex items-center gap-1.5 text-xs text-emerald-400 mb-1">
              <i data-lucide="music" class="w-3.5 h-3.5"></i>
              <span id="recDate">...</span>
            </div>
            <h2 id="recTitle" class="text-xl font-bold text-white">ចំណងជើងការថត</h2>
            <p id="recDuration" class="text-xs text-slate-400 font-mono mt-0.5">រយៈពេល៖ ...</p>
          </div>

          <div class="flex items-center gap-2">
            <a id="downloadBtn" href="#" download class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-medium flex items-center gap-1.5 transition border border-slate-700">
              <i data-lucide="download" class="w-3.5 h-3.5"></i>
              <span>ទាញយកសម្លេង</span>
            </a>
          </div>
        </div>

        <!-- Custom Audio Player Bar -->
        <audio id="audioEl" class="w-full rounded-lg" controls></audio>
      </div>

      <!-- Tabs: Transcript / Live Translation / Administrative Minutes -->
      <div class="flex items-center space-x-2 border-b border-slate-800 pb-2">
        <button onclick="switchShareTab('transcript')" id="stab-transcript" class="px-4 py-2 text-xs font-semibold rounded-lg bg-emerald-600 text-white flex items-center gap-1.5">
          <i data-lucide="align-left" class="w-3.5 h-3.5"></i>
          <span>អត្ថបទបម្លែងសម្លេង (Transcript)</span>
        </button>
        <button onclick="switchShareTab('translation')" id="stab-translation" class="px-4 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white flex items-center gap-1.5">
          <i data-lucide="languages" class="w-3.5 h-3.5"></i>
          <span>ការបកប្រែ (Translation)</span>
        </button>
        <button onclick="switchShareTab('minutes')" id="stab-minutes" class="px-4 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white flex items-center gap-1.5">
          <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
          <span>កំណត់ហេតុផ្លូវការ (Minutes)</span>
        </button>
      </div>

      <!-- Transcript Section -->
      <div id="spane-transcript" class="bg-slate-950 border border-slate-800 rounded-2xl p-6 text-sm text-slate-200 leading-relaxed font-khmer whitespace-pre-line min-h-[200px]">
      </div>

      <!-- Translation Section -->
      <div id="spane-translation" class="hidden bg-slate-950 border border-slate-800 rounded-2xl p-6 text-sm text-emerald-300 leading-relaxed whitespace-pre-line min-h-[200px]">
      </div>

      <!-- Minutes Section -->
      <div id="spane-minutes" class="hidden flex justify-center overflow-x-auto">
        <div id="minutesPaper" class="a4-paper w-full max-w-[21cm]">
          <!-- Rendered dynamically -->
        </div>
      </div>

    </div>

  </main>

  <script>
    lucide.createIcons();
    const urlParams = new URLSearchParams(window.location.search);
    const recId = urlParams.get('id');

    async function loadData() {
      if (!recId) {
        document.getElementById('loadingBox').innerHTML = '<p class="text-rose-400">មិនឃើញ ID នៃឯកសារ</p>';
        return;
      }
      try {
        const res = await fetch('/api/recordings/' + recId);
        if (!res.ok) throw new Error('រកមិនឃើញឯកសារ');
        const data = await res.json();
        
        document.getElementById('loadingBox').classList.add('hidden');
        document.getElementById('contentBox').classList.remove('hidden');

        document.getElementById('recTitle').textContent = data.title || 'ឯកសារថតសម្លេង';
        document.getElementById('recDate').textContent = new Date(data.createdAt).toLocaleString('km-KH');
        document.getElementById('recDuration').textContent = `រយៈពេល៖ ${Math.round(data.duration || 0)} វិនាទី | ទំហំ៖ ${(data.size / 1024 / 1024).toFixed(2)} MB`;

        const audioUrl = '/uploads/' + data.filename;
        const audioEl = document.getElementById('audioEl');
        audioEl.src = audioUrl;

        document.getElementById('downloadBtn').href = audioUrl;
        document.getElementById('downloadBtn').setAttribute('download', data.originalName || data.filename);

        document.getElementById('spane-transcript').textContent = data.transcript || '(គ្មានខ្លឹមសារអត្ថបទ)';
        document.getElementById('spane-translation').textContent = data.liveTranslation || '(គ្មានការបកប្រែ)';

        if (data.administrativeMinutes) {
          renderMinutes(data.administrativeMinutes);
        } else {
          document.getElementById('minutesPaper').innerHTML = '<p class="text-center text-slate-500 py-10">មិនទាន់បានរៀបចំកំណត់ហេតុរដ្ឋបាលសម្រាប់ឯកសារនេះទេ</p>';
        }

      } catch (err) {
        document.getElementById('loadingBox').innerHTML = `<p class="text-rose-400">${err.message}</p>`;
      }
    }

    function renderMinutes(min) {
      document.getElementById('minutesPaper').innerHTML = `
        <table class="w-full mb-6">
          <tr>
            <td class="w-1/2 align-top text-left">
              <div class="font-muol text-xs leading-relaxed text-slate-900">${(min.ministry || 'ក្រសួងមហាផ្ទៃ').replace(/\n/g, '<br>')}</div>
              <div class="text-xs text-slate-700 mt-1">លេខ៖ .................... / ...........</div>
            </td>
            <td class="w-1/2 align-top text-center">
              <div class="font-muol text-sm text-slate-900">ព្រះរាជាណាចក្រកម្ពុជា</div>
              <div class="font-muol text-xs text-slate-900 mt-0.5">ជាតិ សាសនា ព្រះមហាក្សត្រ</div>
              <div class="text-xs text-slate-700 mt-[-2px]">~~~ 🙡 🙣 ~~~</div>
            </td>
          </tr>
        </table>
        <div class="text-center my-6">
          <h2 class="font-muol text-lg text-slate-900">កំណត់ហេតុ</h2>
          <div class="font-muol text-sm text-slate-800 mt-1">ស្តីពី</div>
          <div class="font-muol text-sm text-slate-900 mt-1">${min.title}</div>
        </div>
        <p class="text-justify indent-8 mb-4 text-xs leading-relaxed text-slate-900">
          នៅ${min.datetime} វេលាម៉ោង ........... នៅ${min.location} បានរៀបចំកិច្ចប្រជុំស្តីពី «${min.title}» ក្រោមអធិបតីភាពដ៏ខ្ពង់ខ្ពស់របស់ ${min.signers?.chair || 'ប្រធានអង្គប្រជុំ'}។
        </p>
        <div class="space-y-4 text-xs leading-relaxed text-slate-900">
          <div><h4 class="font-muol text-xs mb-1">I. សមាសភាពចូលរួម៖</h4><div class="indent-6 whitespace-pre-line text-slate-800">${min.attendees}</div></div>
          <div><h4 class="font-muol text-xs mb-1">II. របៀបវារៈនៃអង្គប្រជុំ៖</h4><div class="indent-6 whitespace-pre-line text-slate-800">${min.agenda}</div></div>
          <div><h4 class="font-muol text-xs mb-1">III. ដំណើរការនៃអង្គប្រជុំ និងការពិភាក្សា៖</h4><div class="indent-6 whitespace-pre-line text-slate-800 text-justify">${min.content}</div></div>
          <div><h4 class="font-muol text-xs mb-1">IV. សេចក្តីសម្រេច និងទិសដៅបន្ត៖</h4><div class="indent-6 whitespace-pre-line text-slate-800">${min.decisions}</div></div>
          <div class="pt-2"><p class="indent-8 text-slate-800">${min.closingNote || ''}</p></div>
        </div>
        <table class="w-full mt-12 text-xs">
          <tr>
            <td class="w-1/2 text-center align-top">
              <div class="font-muol text-slate-900">អ្នកធ្វើកំណត់ហេតុ</div>
              <div class="h-16"></div>
              <div class="font-muol text-slate-900">${min.signers?.recorder || 'អ្នកធ្វើកំណត់ហេតុ'}</div>
            </td>
            <td class="w-1/2 text-center align-top">
              <div class="text-slate-800 mb-1">${min.datetime}</div>
              <div class="font-muol text-slate-900">ប្រធានអង្គប្រជុំ</div>
              <div class="h-16"></div>
              <div class="font-muol text-slate-900">${min.signers?.chair || 'ប្រធានអង្គប្រជុំ'}</div>
            </td>
          </tr>
        </table>
      `;
    }

    function switchShareTab(tab) {
      ['transcript', 'translation', 'minutes'].forEach(t => {
        const btn = document.getElementById('stab-' + t);
        const pane = document.getElementById('spane-' + t);
        if (t === tab) {
          btn.className = 'px-4 py-2 text-xs font-semibold rounded-lg bg-emerald-600 text-white flex items-center gap-1.5';
          pane.classList.remove('hidden');
        } else {
          btn.className = 'px-4 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white flex items-center gap-1.5';
          pane.classList.add('hidden');
        }
      });
    }

    loadData();
  </script>
</body>
</html>
